[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apnea-predictor"
version = "0.1.0"
description = "Apnea prediction model using machine learning"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Jack"},
]
license = {text = "MIT"}
keywords = ["apnea", "prediction", "machine-learning"]

dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pillow>=11.0",
    "ipython>=9.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "notebook>=7.0",
    "ipython>=9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
